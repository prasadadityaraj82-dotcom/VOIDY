name: Build VOIDY APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and UPDATE
        run: |
          npm install
          npm install expo@~53.0.20 expo-modules-autolinking@latest expo-modules-core@latest --save
          npx expo install --fix
          
      - name: Create VALID assets
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png
          cp assets/icon.png assets/splash.png
          cp assets/icon.png assets/adaptive-icon.png
          cp assets/icon.png assets/favicon.png
          
      - name: DELETE broken publication configs
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          function fixFile(p){
            try{
              let j=JSON.parse(fs.readFileSync(p,'utf8'));
              let changed=false;
              if(j.android && Array.isArray(j.android.projects)){
                j.android.projects=j.android.projects.filter(pr=>{
                  if(pr.publication && !pr.publication.version){
                    console.log('Removing broken publication from',p);
                    delete pr.publication;
                    changed=true;
                    return true;
                  }
                  return true;
                });
              }
              if(changed) fs.writeFileSync(p, JSON.stringify(j,null,2));
            }catch(e){}
          }
          const nm='node_modules';
          for(const dir of fs.readdirSync(nm)){
            const p1=path.join(nm,dir,'expo-module.config.json');
            if(fs.existsSync(p1)) fixFile(p1);
            const scoped=path.join(nm,dir);
            if(fs.existsSync(scoped) && fs.statSync(scoped).isDirectory() && dir.startsWith('@')){
              for(const sd of fs.readdirSync(scoped)){
                const p2=path.join(scoped,sd,'expo-module.config.json');
                if(fs.existsSync(p2)) fixFile(p2);
              }
            }
          }
          console.log('Cleanup done');
          NODE
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDY-APK
          path: android/app/build/outputs/apk/release/app-release.apk

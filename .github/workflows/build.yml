name: Build VOIDY APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install dependencies
        run: npm install
        
      - name: Create missing assets
        run: |
          mkdir -p assets
          # Create 1x1 transparent PNGs as placeholder if missing (Expo will accept)
          # Using base64 for a valid PNG
          if [ ! -f assets/icon.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > assets/icon.png
          fi
          if [ ! -f assets/splash.png ]; then
            cp assets/icon.png assets/splash.png
          fi
          if [ ! -f assets/adaptive-icon.png ]; then
            cp assets/icon.png assets/adaptive-icon.png
          fi
          ls -lh assets/
        
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDY-APK
          path: android/app/build/outputs/apk/release/app-release.apk

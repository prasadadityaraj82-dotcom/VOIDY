name: Build VOIDY APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and fix dependencies
        run: |
          npm install
          npx expo install --fix
          npm install @expo/config-plugins --save-dev || true
          
      - name: Create assets if missing
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "[STRIPPED 92 bytes]" | base64 -d > assets/icon.png
          fi
          cp assets/icon.png assets/splash.png 2>/dev/null || true
          cp assets/icon.png assets/adaptive-icon.png 2>/dev/null || true
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Fix gradle publication bug
        run: |
          # Fix for expo.modules.plugin.configuration.Publication version bug
          find android -name "*.json" -path "*expo*" -exec sed -i 's/"publication":/"publication": {"version": "1.0.0", /g' {} \; || true
          cat android/app/build.gradle | head -100
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDY-APK
          path: android/app/build/outputs/apk/release/app-release.apk

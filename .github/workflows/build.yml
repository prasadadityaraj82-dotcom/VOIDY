name: Build VOIDY APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: FIX Package.json to Stable Expo 53
        run: |
          cat > package.json <<'JSON'
          {
            "license": "0BSD",
            "main": "index.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android",
              "ios": "expo start --ios",
              "web": "expo start --web"
            },
            "dependencies": {
              "expo": "~53.0.20",
              "expo-status-bar": "~2.2.3",
              "expo-image-picker": "~16.0.6",
              "@expo/vector-icons": "^14.1.0",
              "react-native-paper": "^5.12.5",
              "@react-native-async-storage/async-storage": "2.1.2",
              "react": "19.0.0",
              "react-native": "0.79.5"
            },
            "private": true
          }
          JSON
          rm -rf node_modules package-lock.json
          
      - name: Install
        run: |
          npm install
          npx expo install --fix
          
      - name: Create VALID assets
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png
          cp assets/icon.png assets/splash.png
          cp assets/icon.png assets/adaptive-icon.png
          cp assets/icon.png assets/favicon.png
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDY-APK
          path: android/app/build/outputs/apk/release/app-release.apk

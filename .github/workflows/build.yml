name: Build VOIDY APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and fix dependencies
        run: |
          npm install
          npx expo install --fix
          
      - name: Create VALID assets
        run: |
          mkdir -p assets
          # Download REAL 1024x1024 Expo icon (valid PNG JIMP can read)
          curl -L -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png || \
          curl -L -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/packages/expo-cli/static/icons/ios-1024.png
          cp assets/icon.png assets/splash.png
          cp assets/icon.png assets/adaptive-icon.png
          cp assets/icon.png assets/favicon.png
          file assets/icon.png
          ls -lh assets/
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDY-APK
          path: android/app/build/outputs/apk/release/app-release.apk
